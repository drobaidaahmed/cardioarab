<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!-- ca-theme-toggle:v1 -->
<script>
(function(){
  try{
    var t = localStorage.getItem('cardioarab-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>

<style>
.theme-toggle{position:fixed;top:14px;left:14px;z-index:60;width:38px;height:38px;
  border-radius:50%;background:var(--bg2);border:1px solid var(--border);color:var(--text);
  font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:.2s;box-shadow:0 4px 10px -4px rgba(0,0,0,.3)}
.theme-toggle:hover{border-color:var(--accent);transform:scale(1.06)}
@media(max-width:600px){.theme-toggle{top:10px;left:10px;width:34px;height:34px;font-size:14px}}
</style>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دليلك الإسعافي السريع — CardioArab</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1220;--bg2:#111827;--bg3:#1a2235;--border:#1e2d45;--text:#e2e8f0;--text2:#94a3b8;--accent:#8b5cf6;--font:'IBM Plex Sans Arabic',sans-serif}
:root[data-theme="light"]{--bg:#f4f6fb;--bg2:#ffffff;--bg3:#eef1f8;--border:#e1e6f0;--text:#1b2434;--text2:#5b6577;--accent:#4b06e6;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}

.top-bar{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;padding:12px 20px;max-width:1100px;margin:0 auto;width:100%}
.top-bar a{color:var(--text2);text-decoration:none;font-size:.85rem;padding:.4rem 1rem;border:1px solid var(--border);border-radius:8px;transition:.2s;background:var(--bg2)}
.top-bar a:hover{border-color:var(--accent);color:var(--accent)}

header{text-align:center;padding:46px 20px 30px;background:var(--bg2);border-bottom:1px solid var(--border)}
header h1{font-size:32px;font-weight:700;letter-spacing:.5px}
header p{opacity:.7;margin-top:10px;font-size:15px}

.container{max-width:900px;margin:0 auto;padding:40px 20px;flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px;max-width:900px;margin:0 auto}

.card{position:relative;background:var(--bg2);padding:38px 28px;border-radius:16px;text-align:center;transition:.2s;border:1px solid var(--border);display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:200px;text-decoration:none;color:var(--text)}
.card:hover{border-color:rgba(139,92,246,.4);background:var(--bg3)}
.card .badge-paid{position:absolute;top:12px;left:12px;background:rgba(139,92,246,.15);color:#8b5cf6;border:1px solid rgba(139,92,246,.35);padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.card .badge-free{position:absolute;top:12px;left:12px;background:rgba(16,185,129,.15);color:#10b981;border:1px solid rgba(16,185,129,.35);padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.card .icon{font-size:26px;margin-bottom:14px;width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.card h2{font-size:21px;font-weight:700;margin-bottom:6px}
.card .desc{font-size:14px;opacity:.75;margin-top:8px;line-height:1.6}
.card .icon.c-purple{background:rgba(139,92,246,.18)}
.card .icon.c-red{background:rgba(239,68,68,.18)}

footer{text-align:center;padding:28px 20px;opacity:.65;font-size:13px;border-top:1px solid var(--border);margin-top:10px}

@media(max-width:600px){
  header h1{font-size:24px}
  .grid{grid-template-columns:1fr;gap:14px;max-width:420px}
  .card{min-height:150px;padding:26px 20px}
  .container{padding:20px 16px}
}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8b5cf6">
</head>
<body>
<button id="themeToggle" class="theme-toggle" title="تبديل المظهر" aria-label="تبديل الوضع الداكن/الفاتح">☀️</button>


<div class="top-bar">
  <a href="index.html">🏠 الرئيسية</a>
  <a href="subscription.html">📋 خطط الاشتراك</a>
</div>

<header>
  <h1>🩺 دليلك الإسعافي السريع</h1>
  <p>اختر المرجع المناسب: Pocket Medicine الكامل، أو دليل الطوارئ المجاني</p>
</header>

<div class="container">
  <div class="grid">

    <a href="pocket-index.html" class="card">
      <span class="badge-paid">🔒 مدفوع</span>
      <div class="icon c-purple">📘</div>
      <h2>Pocket Medicine</h2>
      <div class="desc">مرجع الطب الباطني الشامل بكل اختصاصاته</div>
    </a>

    <a href="emergencies.html" class="card">
      <span class="badge-free">✅ مجاني</span>
      <div class="icon c-red">🚨</div>
      <h2>دليل الطوارئ</h2>
      <div class="desc">AHA/ACLS + ESC</div>
    </a>

  </div>
</div>

<footer>
  CardioArab © — دليلك الإسعافي السريع
</footer>

<script src="supabase.js"></script>
<script>
(async function(){
  try{
    const u = JSON.parse(localStorage.getItem('currentUser'));
    const isAdmin = u && u.is_admin;
    const isSubscribed = !isAdmin && u ? await session.isSubscribed() : false;
    if(!isAdmin && !isSubscribed){
      location.href = 'subscription.html';
    }
  }catch(e){
    location.href = 'subscription.html';
  }
})();
</script>
<script src="protection.js"></script>
<script src="presence-tracker.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function(){
  var toggle = document.getElementById('themeToggle');
  if(!toggle) return;
  function updateIcon(){
    var current = document.documentElement.getAttribute('data-theme') || 'dark';
    toggle.textContent = current === 'light' ? '\ud83c\udf19' : '\u2600\ufe0f';
    toggle.title = current === 'light' ? 'تفعيل الوضع الداكن' : 'تفعيل الوضع الفاتح';
  }
  updateIcon();
  toggle.addEventListener('click', function(){
    var current = document.documentElement.getAttribute('data-theme') || 'dark';
    var next = current === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('cardioarab-theme', next); }catch(e){}
    updateIcon();
  });
});
</script>

</body>
</html>
